<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Clientes | Ventas</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
	<header class="row align-items-center g-3 border-bottom pb-3 mb-4">
		<div class="col-12 col-md-6"><h1 class="h2 mb-0">Clientes</h1></div>
		<div class="col-12 col-md-6 d-flex flex-wrap justify-content-md-end gap-2">
			<a class="btn btn-outline-secondary" th:href="@{/comerciales}">Comerciales</a>
			<a class="btn btn-primary" th:href="@{/clientes/crear}">Nuevo cliente</a>
		</div>
	</header>
	<div class="table-responsive">
		<table class="table table-striped table-hover align-middle bg-white">
			<thead class="table-dark"><tr><th>ID</th><th>Nombre</th><th>Apellidos</th><th>Ciudad</th><th class="text-end">Acciones</th></tr></thead>
			<tbody>
			<tr th:each="cliente : ${clientes}">
				<td th:text="${cliente.id}"></td>
				<td th:text="${cliente.nombre}"></td>
				<td th:text="${cliente.apellido1 + (cliente.apellido2 != null ? ' ' + cliente.apellido2 : '')}"></td>
				<td th:text="${cliente.ciudad}"></td>
				<td><div class="d-flex justify-content-end flex-wrap gap-2">
					<a class="btn btn-sm btn-outline-primary" th:href="@{/clientes/{id}(id=${cliente.id})}">Ver</a>
					<a class="btn btn-sm btn-outline-secondary" th:href="@{/clientes/editar/{id}(id=${cliente.id})}">Editar</a>
					<form th:action="@{/clientes/borrar/{id}(id=${cliente.id})}" method="post"><button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button></form>
				</div></td>
			</tr>
			<tr th:if="${#lists.isEmpty(clientes)}"><td class="text-center text-secondary py-4" colspan="5">No hay clientes registrados.</td></tr>
			</tbody>
		</table>
	</div>
</main>
</body>
</html>
