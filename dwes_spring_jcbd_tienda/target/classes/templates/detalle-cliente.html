<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Detalle del cliente</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
	<header class="row align-items-center g-3 border-bottom pb-3 mb-4">
		<div class="col"><h1 class="h2 mb-0">Detalle del cliente</h1></div>
		<div class="col-auto"><a class="btn btn-outline-secondary" th:href="@{/clientes}">Volver</a></div>
	</header>
	<dl class="row g-2">
		<dt class="col-12 col-md-3">ID</dt><dd class="col-12 col-md-9" th:text="${cliente.id}"></dd>
		<dt class="col-12 col-md-3">Nombre</dt><dd class="col-12 col-md-9" th:text="${cliente.nombre}"></dd>
		<dt class="col-12 col-md-3">Primer apellido</dt><dd class="col-12 col-md-9" th:text="${cliente.apellido1}"></dd>
		<dt class="col-12 col-md-3">Segundo apellido</dt><dd class="col-12 col-md-9" th:text="${cliente.apellido2}"></dd>
		<dt class="col-12 col-md-3">Ciudad</dt><dd class="col-12 col-md-9" th:text="${cliente.ciudad}"></dd>
	</dl>
	<a class="btn btn-primary" th:href="@{/clientes/editar/{id}(id=${cliente.id})}">Editar</a>
</main>
</body>
</html>
