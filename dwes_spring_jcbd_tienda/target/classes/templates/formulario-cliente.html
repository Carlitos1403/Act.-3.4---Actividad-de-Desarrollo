<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${edicion ? 'Editar cliente' : 'Nuevo cliente'}">Cliente</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
	<header class="row align-items-center g-3 border-bottom pb-3 mb-4">
		<div class="col"><h1 class="h2 mb-0" th:text="${edicion ? 'Editar cliente' : 'Nuevo cliente'}"></h1></div>
		<div class="col-auto"><a class="btn btn-outline-secondary" th:href="@{/clientes}">Volver</a></div>
	</header>
	<form class="row g-3" th:object="${cliente}" th:action="${edicion ? '/clientes/editar/' + cliente.id : '/clientes/crear'}" method="post">
		<div class="col-12 col-md-6"><label class="form-label" for="nombre">Nombre</label><input class="form-control" id="nombre" th:field="*{nombre}" maxlength="100" required></div>
		<div class="col-12 col-md-6"><label class="form-label" for="apellido1">Primer apellido</label><input class="form-control" id="apellido1" th:field="*{apellido1}" maxlength="100" required></div>
		<div class="col-12 col-md-6"><label class="form-label" for="apellido2">Segundo apellido</label><input class="form-control" id="apellido2" th:field="*{apellido2}" maxlength="100"></div>
		<div class="col-12 col-md-6"><label class="form-label" for="ciudad">Ciudad</label><input class="form-control" id="ciudad" th:field="*{ciudad}" maxlength="100"></div>
		<div class="col-12 d-flex gap-2"><button class="btn btn-primary" type="submit">Guardar</button><a class="btn btn-outline-secondary" th:href="@{/clientes}">Cancelar</a></div>
	</form>
</main>
</body>
</html>
